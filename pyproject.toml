[project]
name = "gka"
version = "0.1.0"
description = "Grouped Key Attention (GKA) vs Grouped Value Attention (GVA) vs GQA: KV-cache-efficient attention experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "numpy",
    "tiktoken",
    "datasets",
    "tqdm",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gka"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
